    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icons. The full-resolution portrait stays reserved for og:image /
         twitter:image, which only link-preview scrapers fetch — serving it as
         the favicon cost 649 KB on every single page load. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Title, description, canonical, Open Graph and Twitter tags are
         rendered per route by src/components/PageMeta.jsx — React 19 hoists
         them into this head. Every indexable route is prerendered to static
         HTML at build time (scripts/prerender.mjs), so crawlers receive them in
         the first response rather than after hydration. -->
    <meta name="author" content="Ahoura Azarbin Bousari" />

    <!-- Open Graph / Social. Absolute URLs: most scrapers will not resolve a
         relative og:image against the page URL. -->
    <meta property="og:site_name" content="Ahoura Azarbin Bousari" />

    <!-- Twitter Card -->
    <meta name="twitter:site" content="@ahoura_az" />
    <meta name="twitter:creator" content="@ahoura_az" />

    <!-- Fonts are self-hosted (see src/style.css). Preload only the latin
         subsets actually used above the fold; the latin-ext and italic faces
         load on demand. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/rP2Hp2ywxg089UriCZOIHTWEBlw.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/QGYvz_MVcBeNP4NJtEtqUYLknw.woff2" />

    <!-- The hero image is the LCP element but lives inside a React component,
         so it is not discoverable until the JS bundle has parsed. Preloading it
         lets the browser fetch it in parallel with the bundle from time zero. -->
    <link rel="preload" as="image" fetchpriority="high" href="/images/generated/hero-bg.jpg" />
